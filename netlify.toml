# Netlify: statički sajt, bez build koraka
[build]
  publish = "."

# stara Netlify adresa vodi na zvanični domen
[[redirects]]
  from = "https://kojivajat.netlify.app/*"
  to = "https://kojivajat.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/evidencija.html"
  [headers.values]
    X-Robots-Tag = "noindex"
